apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "{{ .Release.Name }}-llms"
  labels:
    app: "llm"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: "llm"
  template:
    metadata:
      labels:
        app: "llm"
    spec:
      containers:
        - name: "llm-handler"
          image: {{ .Values.images.llmHandlerImage | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy | quote }}
          env:
            - name: "RABBITMQ_CONNECTION_HOST"
              value: {{ .Values.rabbitmq.service.clusterIP | quote }}
            - name: "RABBITMQ_CONNECTION_PORT"
              value: {{ .Values.rabbitmq.containerPorts.amqp | quote }}
            - name: "RABBITMQ_CONNECTION_USER"
              value: {{ .Values.rabbitmq.auth.username | quote }}
            - name: "RABBITMQ_CONNECTION_PASS"
              value: {{ .Values.rabbitmq.auth.password | quote }}
            - name: "RABBITMQ_JOBS_QUEUE"
              value: {{ .Values.general_config.jobs_queue_name | quote }}
            - name: "OLLAMA_HOST"
              value: {{ .Values.llms.host | quote }}
            - name: "OLLAMA_MODEL"
              value: {{ .Values.llms.model | quote }}
            - name: "REQUEST_TIMEOUT"
              value: {{ .Values.general_config.request_timeout | quote }}
            - name: "RUST_LOG"
              value: {{ .Values.general_config.log_level | quote }}
        - name: "llm"
          image: {{ .Values.images.llmImage | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy | quote }}
          ports:
            - containerPort: 11434
          resources:
            requests:
              cpu: {{ .Values.llms.cpu_request }}
              memory: {{ .Values.llms.memory_request }}
            limits:
              cpu: {{ .Values.llms.cpu_limit }}
