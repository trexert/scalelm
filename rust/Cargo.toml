[package]
name = "scalelm"
version = "0.1.0"
edition = "2024"

[dependencies]
amqprs = { version = "2.1.1", features = ["traces"] }
anyhow = "1.0.97"
axum = "0.8.3"
chrono = "0.4.40"
itertools = "0.14.0"
serde = { version = "1.0.219", features = ["derive"] }
tokio = "1.44.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
uuid = { version = "1.16.0", features = ["v4"] }
